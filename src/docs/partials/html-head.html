<!DOCTYPE html>
<html lang="en" dir="ltr">

  <head>
    <meta charset="utf-8">
    <title>@@title ~ 🎐 Jellyfish UI</title>
    <meta name="description" content="@@description">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="color-scheme" content="light dark">
    <script>
      // Pre-paint theme: apply a stored preference before the first paint so
      // there's no flash. Jellyfish's theme.js keeps this in sync afterwards.
      (function () {
        try {
          var t = localStorage.getItem("jf-theme");
          if (t === "dark" || t === "light") {
            document.documentElement.classList.add("jf-" + t);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="../dist/css/jellyfish.min.css" media="all">
    <link href="@@webRoot/prism.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
    <link rel="icon" type="image/png" href="../img/favicon.png">
  </head>
